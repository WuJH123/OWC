[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owc-efficiency-surrogate"
version = "0.1.0"
description = "Callable XGBoost surrogate for OWC conversion efficiency"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "xgboost>=2.1"]

[tool.setuptools.package-data]
owc_surrogate = ["models/*.json", "models/*.b64.part*"]
